name: Release T0 Code

# Builds the T0 Code fork for Apple silicon, signs it with an Apple Development
# certificate, and publishes it as a GitHub release that installed copies
# auto-update from.
#
# Every push to main releases main as the next patch version, and the workflow
# makes the tag itself. The concurrency group keeps one run building and only
# the newest one waiting, and a waiting run releases main as it is when it
# starts, so a burst of pushes ships as at most two releases.

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".github/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, for example 0.3.0. Leave empty for the next patch."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-t0
  cancel-in-progress: false

jobs:
  plan:
    name: Pick commit and version
    if: github.repository == 'imxv/t0code'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - name: Pick commit and version
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          set -euo pipefail
          sha="$(git ls-remote "$REPO_URL" refs/heads/main | cut -f1)"
          test -n "$sha"
          # "<version> <commit>" per vX.Y.Z tag, lowest first. Annotated tags name their commit on the ^{} line.
          tags="$(git ls-remote --tags "$REPO_URL" | awk '
            {
              ref = $2; sub("^refs/tags/", "", ref); peeled = 0
              if (substr(ref, length(ref) - 2) == "^{}") { ref = substr(ref, 1, length(ref) - 3); peeled = 1 }
            }
            ref ~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ && (peeled || !(ref in commit)) { commit[ref] = $1 }
            END { for (ref in commit) print substr(ref, 2), commit[ref] }
          ' | sort -t. -k1,1n -k2,2n -k3,3n)"
          latest=""
          tagged=""
          while read -r tag_version tag_commit; do
            if [[ -z "$tag_version" ]]; then continue; fi
            latest="$tag_version"
            if [[ "$tag_commit" == "$sha" ]]; then tagged="$tag_version"; fi
          done <<< "$tags"

          if [[ -n "$INPUT_VERSION" ]]; then
            version="${INPUT_VERSION#v}"
          elif [[ -n "$tagged" ]]; then
            version="$tagged"
          elif [[ -n "$latest" ]]; then
            IFS=. read -r major minor patch <<< "$latest"
            version="$major.$minor.$((patch + 1))"
          else
            echo "::error::No vX.Y.Z tag yet. Run this workflow with a version."
            exit 1
          fi
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Version must look like 1.2.3, got '$version'."
            exit 1
          fi
          existing="$(awk -v v="$version" '$1 == v { print $2 }' <<< "$tags")"
          if [[ -n "$existing" && "$existing" != "$sha" ]]; then
            echo "::error::v$version already tags $existing, not main ($sha)."
            exit 1
          fi

          publish=true
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | grep -Fxq latest-mac.yml; then
            echo "v$version already ships main ($sha). Nothing to release."
            publish=false
          else
            echo "Releasing main ($sha) as v$version."
          fi
          {
            echo "sha=$sha"
            echo "version=$version"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

  macos-arm64:
    name: Build and publish macOS arm64
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      # Same checkout as release-desktop.yml: skip the vendored .repos tree.
      - name: Checkout
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: "0"
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$SHA"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout --detach FETCH_HEAD

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Import signing certificate
        id: signing
        shell: bash
        env:
          CSC_LINK: ${{ secrets.T0_MACOS_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.T0_MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$CSC_LINK" || -z "$CSC_KEY_PASSWORD" ]]; then
            echo "::error::Set the T0_MACOS_CERTIFICATE_P12 and T0_MACOS_CERTIFICATE_PASSWORD secrets."
            exit 1
          fi
          keychain="$RUNNER_TEMP/t0-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          cert="$RUNNER_TEMP/t0-signing.p12"
          (umask 077 && printf '%s' "$CSC_LINK" | base64 --decode > "$cert")
          security import "$cert" -k "$keychain" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          rm -f "$cert"
          # Apple Development certificates chain through WWDR G3, which runners may lack.
          curl -fsSL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o "$RUNNER_TEMP/wwdr-g3.cer"
          security import "$RUNNER_TEMP/wwdr-g3.cer" -k "$keychain" || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          existing="$(security list-keychains -d user | tr -d '"')"
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$keychain" $existing
          identity="$(security find-identity -v -p codesigning "$keychain" | awk '/"Apple Development: / { print $2; exit }')"
          if [[ -z "$identity" ]]; then
            echo "::error::No valid Apple Development identity in T0_MACOS_CERTIFICATE_P12."
            exit 1
          fi
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      - name: Build signed app
        shell: bash
        env:
          # Public T3 Connect identifiers from .env.example, the same ones official builds ship.
          T3CODE_CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsudDMuY29kZXMk
          T3CODE_CLERK_JWT_TEMPLATE: t3-relay
          T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: hzxSgY2cH10sDU2r
          T3CODE_RELAY_URL: https://relay.t3.codes
          T3CODE_DESKTOP_LOCAL_SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          vp run dist:desktop:artifact \
            --platform mac --target dmg --arch arm64 \
            --build-version "$VERSION" --signed --verbose

      - name: Verify signature
        shell: bash
        run: |
          set -euo pipefail
          app="$(find release -maxdepth 3 -name '*.app' -type d | head -n 1)"
          if [[ -n "$app" ]]; then
            codesign --verify --deep --strict "$app"
            codesign -dvv "$app" 2>&1 | grep -E 'Identifier|Authority|TeamIdentifier'
          fi

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.plan.outputs.sha }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          artifact="T0-Code-$VERSION-arm64"
          files=(
            "release/$artifact.dmg"
            "release/$artifact.dmg.blockmap"
            "release/$artifact.zip"
            "release/$artifact.zip.blockmap"
            "release/latest-mac.yml"
          )
          for file in "${files[@]}"; do
            test -f "$file" || { echo "::error::Missing $file"; ls -la release; exit 1; }
          done
          grep -Fxq "version: $VERSION" release/latest-mac.yml
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "v$VERSION" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "v$VERSION" "${files[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$SHA" \
              --title "T0 Code $VERSION" \
              --notes "T0 Code $VERSION for macOS (Apple silicon). Unofficial fork of T3 Code." \
              --latest
          fi

      - name: Remove signing keychain
        if: always()
        shell: bash
        run: security delete-keychain "$RUNNER_TEMP/t0-signing.keychain-db" 2>/dev/null || true
